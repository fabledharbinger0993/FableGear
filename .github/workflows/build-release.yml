name: Build and Release FableGear

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          body: |
            ## Download

            | Platform | Download |
            |---|---|
            | **macOS** (10.15+, Intel + Apple Silicon) | FableGear.zip |
            | **Windows** (10/11, 64-bit) | FableGear-Windows.zip |

            ### macOS install
            1. Download FableGear.zip → unzip → drag FableGear.app to Applications
            2. First launch: right-click → Open → Open Anyway (Gatekeeper). A Terminal
               window opens to finish setup and start FableGear; later launches are
               instant and auto-update to the latest release.

            ### Windows install
            1. Download FableGear-Windows.zip → unzip to any folder
            2. Double-click `launch.bat` OR `FableGear.exe`
            3. **WebView2 Runtime** is required — ships with Windows 11; Windows 10 users
               may need to install it from microsoft.com/edge/download/runtime
            4. **Audio fingerprinting** (AcoustID) requires `fpcalc` — download
               `fpcalc.exe` from acoustid.org/chromaprint and place it anywhere on PATH,
               or skip it (tagging, renaming, and all other features work without it)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build FableGear.exe (Windows)
    runs-on: windows-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg
        run: |
          choco install ffmpeg --no-progress -y

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_build.txt

      - name: Build FableGear (Windows)
        run: |
          pyinstaller FableGear_win.spec --noconfirm

      - name: Zip Windows build
        run: |
          cd dist
          Compress-Archive -Path FableGear -DestinationPath FableGear-Windows.zip
          cd ..

      - name: Upload Windows artifact to release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/FableGear-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
