name: Build and Release FableGear

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish FableGear.zip
    runs-on: macos-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # build_release.sh needs tags for `git describe`

      - name: Build FableGear.app bootstrap bundle
        # Single source of truth: build_release.sh writes the shell-script
        # launcher (~/FableGear path, `open -a Terminal`, no Automation prompt)
        # and packages FableGear.zip. No inline launcher copy to drift out of sync.
        run: bash build_release.sh

      - name: Create release and upload FableGear.zip
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: FableGear.zip
          body: |
            ## Download

            **↓ FableGear.zip** — the two "Source code" files below are
            auto-generated by GitHub and are not the app.

            ## Install (macOS)

            1. Download **FableGear.zip** → unzip → drag **FableGear.app** to Applications
            2. First launch: right-click → **Open** → **Open Anyway** (Gatekeeper). A
               Terminal window opens to finish setup and start FableGear; later launches
               are instant and auto-update to the latest release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
