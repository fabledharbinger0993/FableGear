name: Build and Release FableGear

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body: |
            ## Download

            | Platform | Download |
            |---|---|
            | **macOS** (12+, Intel + Apple Silicon) — full bundle | FableGear-macOS.zip |
            | **macOS** — bootstrap installer (clones repo, auto-updates) | FableGear.zip |
            | **Windows** (10/11, 64-bit) | FableGear-Windows.zip |

            The README download button and the in-app updater both use
            FableGear.zip (bootstrap). FableGear-macOS.zip is the standalone
            PyInstaller bundle — no Python or git required.

            ### macOS install
            1. Download FableGear-macOS.zip → unzip → drag FableGear.app to Applications
            2. First launch: right-click → Open → Open Anyway (Gatekeeper)

            ### Windows install
            1. Download FableGear-Windows.zip → unzip to any folder
            2. Double-click `launch.bat` OR `FableGear.exe`
            3. **WebView2 Runtime** is required — ships with Windows 11; Windows 10 users
               may need to install it from microsoft.com/edge/download/runtime
            4. **Audio fingerprinting** (AcoustID) requires `fpcalc` — download
               `fpcalc.exe` from acoustid.org/chromaprint and place it anywhere on PATH,
               or skip it (tagging, renaming, and all other features work without it)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build FableGear.app (macOS)
    runs-on: macos-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          brew install ffmpeg chromaprint

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_build.txt

      - name: Build FableGear.app
        run: |
          pyinstaller FableGear.spec --noconfirm

      - name: Zip macOS app
        run: |
          cd dist
          zip -r FableGear-macOS.zip FableGear.app
          cd ..

      - name: Upload macOS artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FableGear-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build FableGear.exe (Windows)
    runs-on: windows-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg
        run: |
          choco install ffmpeg --no-progress -y

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_build.txt

      - name: Build FableGear (Windows)
        run: |
          pyinstaller FableGear_win.spec --noconfirm

      - name: Zip Windows build
        run: |
          cd dist
          Compress-Archive -Path FableGear -DestinationPath FableGear-Windows.zip
          cd ..

      - name: Upload Windows artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FableGear-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-bootstrap-zip:
    name: Build & attach FableGear.zip (bootstrap)
    runs-on: macos-latest
    needs: create-release
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build FableGear.app bootstrap bundle
        run: |
          mkdir -p dist/FableGear.app/Contents/MacOS
          mkdir -p dist/FableGear.app/Contents/Resources
          cat > dist/FableGear.app/Contents/MacOS/FableGear << 'LAUNCHER'
          #!/bin/bash
          PARENT_DIR="$HOME/FableGear"
          INSTALL_DIR="$PARENT_DIR/FableGear"
          REPO_URL="https://github.com/fabledharbinger0993/FableGear.git"
          if [ -d "$INSTALL_DIR/.git" ]; then
            bash "$INSTALL_DIR/launch.sh"
          else
            CLONE_CMD="mkdir -p '$PARENT_DIR' && git clone '$REPO_URL' '$INSTALL_DIR' && bash '$INSTALL_DIR/launch.sh'"
            osascript -e "tell application \"Terminal\" to do script \"$CLONE_CMD\""
            osascript -e "tell application \"Terminal\" to activate"
          fi
          LAUNCHER
          chmod +x dist/FableGear.app/Contents/MacOS/FableGear
          cat > dist/FableGear.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>FableGear</string>
            <key>CFBundleIdentifier</key><string>com.fabledharbinger.fablegear</string>
            <key>CFBundleName</key><string>FableGear</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          echo -n "APPL????" > dist/FableGear.app/Contents/PkgInfo
          ICON_SRC="static/icon-app-dock.png"
          [ ! -f "$ICON_SRC" ] && ICON_SRC="static/icon-logo-fablegear.png"
          if [ -f "$ICON_SRC" ]; then
            ICONSET_DIR="$(mktemp -d)/fablegear.iconset"
            mkdir -p "$ICONSET_DIR"
            for size in 16 32 64 128 256 512; do
              sips -z $size $size "$ICON_SRC" --out "$ICONSET_DIR/icon_${size}x${size}.png" >/dev/null 2>&1
              double=$((size * 2))
              sips -z $double $double "$ICON_SRC" --out "$ICONSET_DIR/icon_${size}x${size}@2x.png" >/dev/null 2>&1
            done
            iconutil -c icns "$ICONSET_DIR" -o dist/FableGear.app/Contents/Resources/applet.icns
          fi

      - name: Build FableGear.zip
        run: |
          cd dist
          zip -r -y /tmp/FableGear.zip FableGear.app
          unzip -l /tmp/FableGear.zip

      - name: Attach FableGear.zip + install.sh to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" /tmp/FableGear.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "${{ github.ref_name }}" install.sh --clobber --repo "$GITHUB_REPOSITORY"
