name: CI

# Runs on every push/PR to main. build-release.yml only builds & publishes on
# a version tag — it never ran the test suite, ruff, or pyright automatically,
# so regressions could land on main unnoticed until someone ran them by hand.
#
# `test` and `lint` are both real gates. The ruff backlog referenced by the
# earlier version of this comment is cleared: ruff.toml now sets an explicit
# rule selection and `ruff check .` passes clean, so a new finding means a new
# problem rather than one more line in a wall nobody reads.
#
# `typecheck` (pyright) stays informational — its backlog has not been assessed.
# Flip its continue-on-error to false once it reports clean.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # tests/test_static_js_syntax.py parses every shipped .js and skips when
      # node is absent. The macOS runner image already ships node, so this is
      # not fixing a skip — it pins the version so that guard cannot quietly
      # stop running if a future image drops or changes it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ffmpeg genuinely IS missing on the runner. Twelve tests skip because of
      # it: every ffmpeg-backed test in test_audio_processor.py and
      # test_tagger_effects.py. That includes the regression tests for the
      # normalise bug that clipped 39 of 39 sampled tracks and deleted the
      # originals. Those guards have never once executed in CI.
      #
      # Homebrew rather than a third-party setup action: slower, but it is
      # already on the image and adds no new supply-chain dependency to the
      # workflow that gates every merge.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # config.py calls load_user_config() at import time, and nearly every
      # module under test imports config transitively. A fresh runner has no
      # ~/.fablegear/config.json, so collection fails before any test runs.
      # Write a stub config with the required keys (values are never read
      # from disk by the unit tests) so import succeeds.
      - name: Create stub FableGear config
        run: |
          mkdir -p ~/.fablegear
          cat > ~/.fablegear/config.json <<'EOF'
          {
            "local_db": "/tmp/fablegear-ci/local_master.db",
            "device_db": "/tmp/fablegear-ci/device_master.db",
            "music_root": "/tmp/fablegear-ci/Music",
            "backup_dir": "/tmp/fablegear-ci/backups"
          }
          EOF

      - name: Run tests
        run: python -m pytest -q

  # ruff now passes clean, so it gates. Split out from pyright deliberately:
  # a job that is always red cannot tell anyone when something new breaks, and
  # keeping these together would drag ruff back into that state.
  lint:
    name: Lint (ruff)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

  # pyright still has a backlog that has not been assessed, so it stays
  # advisory. Flip continue-on-error to false once it reports clean.
  typecheck:
    name: Type-check (pyright, informational)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyright

      - name: pyright
        run: pyright .
