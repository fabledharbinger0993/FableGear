    <!-- ── Dead File Scanner ──────────────────────────────────────────────── -->
    <div class="db-panel-section" id="db-panel-dead-files">
      <div class="db-panel-tool-head">
        <div class="db-panel-icon"><img src="/static/icon-fg-files.png" alt="Dead Files"></div>
        <div>
          <div class="db-panel-tool-title">Dead File Scanner</div>
          <div class="db-panel-tool-blurb">Finds audio files on connected drives that are not referenced in any Rekordbox database — local or device.</div>
        </div>
      </div>
      <div class="field">
        <label>Drive / Folder(s) to Scan</label>
        <div class="folder-zone" id="dead-files-zone">
          <div class="folder-zone-hint">
            <strong>⤵ Drop folder here</strong>
            or type a path and press Enter
          </div>
          <div class="folder-zone-input-row">
            <input type="text" class="folder-zone-text" id="dead-files-zone-text" placeholder="/Volumes/YourDrive/Music">
            <button class="folder-zone-browse" type="button" onclick="pickFolderFor('dead-files-pills')">Browse…</button>
            <button class="folder-zone-add"    type="button" onclick="deadFilesZoneAdd()">+ Add</button>
          </div>
        </div>
        <div class="folder-pills" id="dead-files-pills"></div>
        <button type="button" class="btn btn-secondary btn-xs use-queue-btn"
                onclick="stagingPopulatePills('dead-files-pills')"
                title="Load staging queue into this tool">Use Queue</button>
      </div>
      <div class="btn-row audit-btn-mt">
        <button type="button" class="btn btn-neon" onclick="runDeadFiles()">Scan for Untracked Files</button>
      </div>
    </div>
